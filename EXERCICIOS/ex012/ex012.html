<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos com HTML 5</title>
</head>
<body>
    <h1>Videos hospedados localmente</h1>
    <p>Este video esta hospedado no meu próprio servidor</p>

    <video width="200" poster="images/minha-capa.jpg" controls autoplay loop>
        <source src="media/Meu-Video.mp4" type="video/mp4">
        <source src="media/Meu-Video.webm" type="video/webm">
        <source src="media/Meu-Video(2).mov" type="video/mov">
        <p>Seu navegador não tem compatibilidade com reprodução de videos.</p>

    </video>
    <h1>Inserindo videos do youtube</h1>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/XtwD48odALo?si=eGW5n3GTmn3YGyka" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

    <h1>inserindo videos do vimeo</h1>
</body>
</html>
