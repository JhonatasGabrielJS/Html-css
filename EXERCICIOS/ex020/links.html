<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>

        /* SELETORES PERSONALIZADOS
            # = id
            . = class
            : = pseudo-class
            ::pseudo-element
            > clildren
        */
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        a {
            color: thistle;
            text-decoration: none;
            font-weight: bold;
        }

        a:visited {
            color: springgreen;
        }

        a:hover {
            color: sandybrown;
            text-decoration: underline;
        }

        a:active {
            color: royalblue;
        }

        .especial {
            background-color: hwb(263 25% 7% / 0.555);
        }

        .especial::before {
            content: ' => ';
        }

        .especial::after {
            content: ' <= ';
            text-decoration: none;
            font-weight: normal;
            color: violet;

        }
    </style>
</head>
<body>
    <h1>Personalizando Links</h1>
    <ul>
        <li><a href="https://gustavoguanabara.github.io" target="_blank">Repositório do Github</a></li>
        <li><a href="https://youtube.com/cursoenvideo/" class="especial">Canal do youtube</a></li>
        <li><a href="https://www.cursoemvideo.com">site do curso em video</a></li>
    </ul>
</body>
</html>
