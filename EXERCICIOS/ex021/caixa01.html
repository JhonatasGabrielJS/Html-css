<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelos de Ciaxas</title>
    <style>
        body {
            background-color: burlywood;
        }
        h1 { /*box-level*/
            color: rgba(145, 0, 241, 0.74);
            background-color: rgba(3, 218, 189, 0.849);
            height: 300px;
            width: 300px;

            border: 8px solid rgb(238, 220, 174);

            padding: 2px 20px;

          margin: 20px 20px 40px 20px;

           outline: 5px dashed rgb(23, 145, 216);

        }

            ou

        a { /*inline-level*/
            border-width: 10px; 
            border-style:groove ;
            border-color: yellowgreen;
            
            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;
        }

        p {
            color: blueviolet;
        }


    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Parágrafos também são exemplos de box-level, mas os <a href="#">links são exemplos de caixas inline-level</a>. Vamos ver como tudo isso funciona.</p>
</body>
</html>
